# fly.toml — LoyaNexa merchant demo
#
# The business is UK-registered (London), so `lhr` is primary_region rather
# than a US default. This app has no build-time secrets: Apple Wallet
# credentials arrive as runtime env vars via `fly secrets set` (see
# docs/DEPLOY.md) and are read by packages/pass/src/credentials.ts, never
# baked into the image.

app = "loyanexa-new"
primary_region = "lhr"

[build]

# Applies pending Prisma migrations before any new machine takes traffic.
# `migrate deploy` only replays already-generated migrations — unlike
# `migrate dev` it never prompts, never resets, and never invents a new one,
# which is what makes it safe to run unattended against a live database.
[deploy]
  release_command = "npx prisma migrate deploy --schema packages/db/prisma/schema.prisma"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Changed 2026-08-03: was `true`. With autostop on, Fly stopped BOTH machines
  # when idle despite min_machines_running = 1, and the next request paid a
  # measured 7.6s cold start — a fresh container plus a fresh TLS handshake to
  # Apple. That alone blows the 1-2 second scan-to-banner target, and it drops
  # the long-lived APNs HTTP/2 session that BUILD.md §18 item 3 exists to
  # protect. One always-on shared-cpu-1x/512MB machine costs a few pounds a
  # month; a stamp that takes eight seconds to appear costs the product.
  auto_stop_machines = false
  auto_start_machines = true
  # Changed 2026-08-03: was 0. Live Wallet updates need a warm long-lived
  # HTTP/2 session to Apple's APNs gateway (BUILD.md §18 item 3) — scaling
  # to zero drops that session, and the cold start it costs on the next
  # request (fresh container + fresh TLS handshake to Apple) blows the
  # 1-2 second stamp-to-banner target on whichever request pays for it. Keep
  # one machine running always; auto_stop_machines can still reclaim any
  # *extra* machines a traffic spike started. See docs/DEPLOY.md.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
