 --paper:#0B121C;--sunk:#0E1826;--ink:#EDF1F6;--ink-2:#A9B4C2;--ink-3:#76839A;
 --line:#162334;--line-2:#1C2C41;--green:#5E9B77;--red:#C4695F;
 --sh1:none;--sh2:none;--sh3:0 8px 28px rgba(0,0,0,.42)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,sans-serif;
 font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:Tajawal,system-ui,sans-serif}
html[lang=ar] *{letter-spacing:0 !important}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
html[lang=ar] .mono{font-family:Tajawal,sans-serif}
.w{max-width:1140px;margin:0 auto;padding:0 22px}
@media(min-width:900px){.w{padding:0 40px}}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.045em;line-height:1.14}
h1{font-size:clamp(2.1rem,5.4vw,3.9rem)}
h2{font-size:clamp(1.6rem,3.4vw,2.5rem)}
h3{font-size:1.05rem;letter-spacing:-.02em;line-height:1.4}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;
 text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:9px;margin-bottom:16px}
html[lang=ar] .eyebrow{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px}
.lead{color:var(--ink-2);font-size:clamp(1rem,1.4vw,1.1rem);line-height:1.85;max-width:60ch}
.slots{display:flex;gap:5px}.slots i{width:7px;height:7px;border-radius:50%;
 border:1.4px solid var(--line-2);display:block}.slots i.on{background:var(--violet);border-color:var(--violet)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand-bg);
 color:#fff;border:1px solid var(--brand-bg);padding:13px 26px;border-radius:var(--r2);font:inherit;
 font-size:15px;font-weight:500;cursor:pointer;transition:filter .16s,transform .16s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink-3);filter:none}
.btn.sm{padding:9px 18px;font-size:14px}
.icobtn{width:36px;height:36px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r1);
 cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icobtn:hover{border-color:var(--line-2);color:var(--ink)}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--canvas) 88%,transparent);
 backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:66px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.03em}
.logo svg{width:26px;height:26px;color:var(--indigo);flex:0 0 auto}
nav.main{display:none;gap:28px;font-size:14.5px;color:var(--ink-2)}
@media(min-width:1000px){nav.main{display:flex}}
nav.main a:hover{color:var(--ink)}
.hg{display:flex;align-items:center;gap:8px}
.hide-sm{display:none}@media(min-width:760px){.hide-sm{display:inline-flex}}
section{padding:70px 0}@media(min-width:900px){section{padding:94px 0}}
.sechead{max-width:640px;margin-bottom:44px}.sechead h2{margin-bottom:14px}
/* hero */
.hero{padding:58px 0 24px}@media(min-width:900px){.hero{padding:80px 0 40px}}
.hgrid{display:grid;gap:44px;align-items:center}
@media(min-width:980px){.hgrid{grid-template-columns:1.1fr .9fr;gap:64px}}
.hero h1{margin:18px 0}
.hcta{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}
.hnote{color:var(--ink-3);font-size:13.5px;margin-top:15px}
.wallets{display:flex;gap:18px;align-items:center;margin-top:26px;padding-top:22px;
 border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;flex-wrap:wrap}
.wallets b{display:flex;align-items:center;gap:7px;font-weight:500;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);
 border-radius:100px;padding:7px 16px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.cardwrap{display:flex;justify-content:center}
.lcard{width:min(330px,100%);background:var(--brand-bg);color:#fff;border-radius:var(--r5);
 padding:20px;box-shadow:var(--sh3)}
.lct{display:flex;justify-content:space-between;align-items:flex-start}
.lcm{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.lck{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;opacity:.72}
html[lang=ar] .lck{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:10px}
.lcn{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:500;line-height:1;text-align:end}
.lcc{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:18px 0 16px}
.lcc i{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.42);display:grid;
 place-items:center;transition:background .35s,border-color .35s}
.lcc i.on{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.92)}
.lcc i svg{width:52%;opacity:0;transition:opacity .3s}.lcc i.on svg{opacity:1}
.lcq{background:#fff;border-radius:var(--r1);padding:9px;width:112px;margin:18px auto 0}
.lcq canvas{width:94px;height:94px;image-rendering:pixelated;display:block}
.lcq span{display:block;text-align:center;font-size:9.5px;color:#16191F;margin-top:4px;
 font-family:'JetBrains Mono',monospace}
/* prose */
.prose p{color:var(--ink-2);font-size:16px;line-height:1.95;max-width:70ch;margin:0 0 16px}

<script>// Minimal but CORRECT QR encoder — byte mode, ECC level L, versions 1..4 (single block).
function qrMatrix(text, forceMask){
  const CAP = {1:19, 2:34, 3:55, 4:80};      // data codewords, ECC-L
  const ECW = {1:7, 2:10, 3:15, 4:20};       // ec codewords, ECC-L
  const bytes = [...new TextEncoder().encode(text)];
  let ver = 0;
  for (const v of [1,2,3,4]) if (bytes.length + 2 <= CAP[v]) { ver = v; break; }
  if (!ver) throw new Error("too long");
  const size = 17 + 4*ver, cap = CAP[ver], ecn = ECW[ver];

  // ---- bit stream: mode(0100) + count(8) + data ----
  const bits = [];
  const put = (val, len) => { for (let i = len-1; i >= 0; i--) bits.push((val>>i)&1); };
  put(0b0100, 4); put(bytes.length, 8);
  for (const b of bytes) put(b, 8);
  put(0, Math.min(4, cap*8 - bits.length));           // terminator
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8)
    data.push(bits.slice(i, i+8).reduce((a,b)=>(a<<1)|b, 0));
  const PAD = [0xEC, 0x11];
  for (let i = 0; data.length < cap; i++) data.push(PAD[i%2]);

  // ---- Reed-Solomon over GF(256), primitive 0x11D ----
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++){ EXP[i]=x; LOG[x]=i; x<<=1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i-255];
  const mul = (a,b) => (a===0||b===0) ? 0 : EXP[LOG[a]+LOG[b]];
  let gen = [1];
  for (let i = 0; i < ecn; i++){
    const next = new Array(gen.length+1).fill(0);
    for (let j = 0; j < gen.length; j++){
      next[j]   ^= gen[j];
      next[j+1] ^= mul(gen[j], EXP[i]);
    }
    gen = next;
  }
  const rem = new Array(ecn).fill(0);
  for (const d of data){
    const factor = d ^ rem[0];
    rem.shift(); rem.push(0);
    for (let j = 0; j < ecn; j++) rem[j] ^= mul(gen[j+1], factor);
  }
  const all = [...data, ...rem];

  // ---- matrix ----
  const m = Array.from({length:size}, () => new Array(size).fill(null));
  const set = (r,c,v) => { if (r>=0 && r<size && c>=0 && c<size) m[r][c] = v; };

  const finder = (r,c) => {
    for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++){
      const inside = i>=0 && i<7 && j>=0 && j<7;
      const dark = inside && (i===0||i===6||j===0||j===6 || (i>=2&&i<=4&&j>=2&&j<=4));
      set(r+i, c+j, dark ? 1 : 0);
    }
  };
  finder(0,0); finder(0,size-7); finder(size-7,0);

  for (let i = 8; i < size-8; i++){ const b = i%2===0?1:0; set(6,i,b); set(i,6,b); } // timing

  if (ver >= 2){                                                   // alignment
    const c = {2:18, 3:22, 4:26}[ver];
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++)
      set(c+i, c+j, (Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0)) ? 1 : 0);
  }
  set(size-8, 8, 1);                                               // dark module
  for (let i = 0; i < 9; i++){                                     // format reserve
    if (m[8][i]===null) set(8,i,0);
    if (m[i][8]===null) set(i,8,0);
  }
  for (let i = 0; i < 8; i++){ set(8, size-1-i, 0); set(size-1-i, 8, 0); }

  // ---- data placement (zigzag, upward/downward columns) ----
  const mask = forceMask ?? 0;
  const MASKS = [
    (r,c)=>(r+c)%2===0, (r,c)=>r%2===0, (r,c)=>c%3===0, (r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0, (r,c)=>((r*c)%2)+((r*c)%3)===0,
    (r,c)=>(((r*c)%2)+((r*c)%3))%2===0, (r,c)=>(((r+c)%2)+((r*c)%3))%2===0,
  ];
  let bi = 0, up = true;
  for (let col = size-1; col > 0; col -= 2){
    if (col === 6) col--;                                          // skip timing column
    for (let k = 0; k < size; k++){
      const row = up ? size-1-k : k;
      for (const c of [col, col-1]){
        if (m[row][c] !== null) continue;
        let bit = 0;
        if (bi < all.length*8) bit = (all[bi>>3] >> (7-(bi&7))) & 1;
        bi++;
        m[row][c] = MASKS[mask](row,c) ? bit^1 : bit;
      }
    }
    up = !up;
  }

  // ---- format info: ECC L = 01, BCH(15,5) ----
  const fmtData = (0b01 << 3) | mask;
  let v = fmtData << 10;
  for (let i = 4; i >= 0; i--) if ((v >> (i+10)) & 1) v ^= 0b10100110111 << i;
  const fmt = ((fmtData << 10) | v) ^ 0b101010000010010;
  for (let i = 0; i < 15; i++){
    const b = (fmt >> i) & 1;
    // vertical strip (top-left column, then bottom-left)
    if (i < 6)      set(i, 8, b);
    else if (i < 8) set(i+1, 8, b);
    else            set(size-15+i, 8, b);
    // horizontal strip (top-right row, then top-left)
    if (i < 8)      set(8, size-1-i, b);
    else if (i === 8) set(8, 7, b);
    else            set(8, 14-i, b);
  }
  set(size-8, 8, 1);
  return m;
}</script>

function paint(){
 document.documentElement.lang=LANG;
 document.documentElement.dir=L[LANG].dir;
 document.getElementById('langBtn').textContent=LANG==='ar'?'EN':'ع';
 document.querySelectorAll('[data-l]').forEach(e=>e.innerHTML=t(e.dataset.l));

  <svg class="ic" viewBox="0 0 24 24" fill="none">${p}</svg>
  <h3>${t(k)}</h3><p>${t(k+'p')}</p></div>`).join('');

 cmpTable.innerHTML=`<tr><th>${t('cmp_c')}</th><th class="d">${t('cmp_d')}</th><th>${t('cmp_p')}</th></tr>`+
  CMP.map(([a,b,c])=>`<tr><td>${t(a)}</td><td class="d">${t(b)}</td><td class="p">${t(c)}</td></tr>`).join('');

 const secHtml=SECS.map(([k,p])=>`<a class="sc" href="#" onclick="return false">
  <svg viewBox="0 0 24 24" fill="none">${p}</svg>${t(k)}</a>`).join('');
 secGrid.innerHTML=secHtml;
 footSecs.innerHTML=SECS.map(([k])=>`<a href="#" onclick="return false">${t(k)}</a>`).join('');

 ptog.innerHTML=[['monthly',''],['annual',t('save2')]].map(([p,s])=>
  `<button class="${PERIOD===p?'on':''}" onclick="PERIOD='${p}';paint()">${t(p)}
   ${s?`<span class="save">${s}</span>`:''}</button>`).join('');

 plans.innerHTML=PLANS.map(p=>{
  const price=PERIOD==='monthly'?p.m:p.y;
  const per=PERIOD==='monthly'?t('per_m'):t('per_y');
  const caps=[`${n(t(p.cards))} ${t('f_cards')}`,`${n(t(p.loc))} ${t('f_loc')}`]
   .concat(p.staff?[`${n(t(p.staff))} ${t('f_staff')}`]:[]);
  return `<div class="plan${p.best?' feat':''}">
   ${p.best?`<span class="tagm">${t('most')}</span>`:''}
   <h3>${t(p.k)}</h3>
   <div class="price">£${n(price)}<small>${per}</small></div>
   <ul>${caps.concat(p.f.map(f=>t(f))).map(x=>`<li>${TICK}<span>${x}</span></li>`).join('')}</ul>

const GOAL=8; let filled=0;
const STAMP='<svg viewBox="0 0 24 24" fill="none" stroke="#203757" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
function drawCard(){
 lcC.innerHTML=Array.from({length:GOAL},(_,i)=>`<i class="${i<filled?'on':''}">${STAMP}</i>`).join('');
 lcN.textContent=n(filled)}
if(!(typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches))
 setInterval(()=>{filled=filled>=GOAL?0:filled+1;drawCard()},1500);
(function(){const c=lcQ.getContext('2d');const m=qrMatrix('https://loyanexa.com/11819',0),len=m.length;
 const p=Math.floor(lcQ.width/(len+6)),o=Math.floor((lcQ.width-p*len)/2);
 c.fillStyle='#fff';c.fillRect(0,0,lcQ.width,lcQ.height);c.fillStyle='#16191F';
 for(let r=0;r<len;r++)for(let k=0;k<len;k++)if(m[r][k])c.fillRect(o+k*p,o+r*p,p,p)})();

function drawArtQR(){
 const cv=document.getElementById('paQR'); if(!cv)return;
 const x=cv.getContext('2d'), m=qrMatrix('https://loyanexa.com/11819',0), L2=m.length;
 const p=Math.floor(cv.width/(L2+4)), o=Math.floor((cv.width-p*L2)/2);
 x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#0B0B0D';
 for(let r=0;r<L2;r++)for(let c=0;c<L2;c++)if(m[r][c])x.fillRect(o+c*p,o+r*p,p,p)}
let io;
function observe(){
 if(typeof IntersectionObserver==='undefined'){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return}
 io?.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),
  {threshold:.06,rootMargin:'0px 0px -30px'});
 document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%4)*0.05+'s';io.observe(el)})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(0)});
applyTheme(); paint();
