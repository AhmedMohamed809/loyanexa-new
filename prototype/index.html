:root{
 /* LoyaNexa — from the logo */
 --brand:#203757;--brand-2:#2C4A73;--brand-deep:#16263D;--accent:#F96400;--accent-ink:#FFFFFF;
 --canvas:#F4F6FA;--paper:#FFF;--sunk:#EEF1F6;--tint:#E9EEF6;
 --ink:#16273D;--ink-2:#4A5A70;--ink-3:#8794A5;--line:#E3E8EF;--line-2:#CFD7E2;
 --green:#2E8B57;--amber:#B0802F;
 --r1:8px;--r2:10px;--r3:14px;--r4:18px;--r5:22px;
 --sh1:0 1px 2px rgba(22,39,61,.05);--sh2:0 4px 14px rgba(22,39,61,.07);--sh3:0 12px 34px rgba(22,39,61,.13)}
html[data-theme=violet]{
 --brand:#482887;--brand-2:#5B37A3;--brand-deep:#391F6C;--accent:#7EDDD0;--accent-ink:#123B36;
 --canvas:#F3F1FB;--paper:#FFF;--sunk:#EFEDF9;--tint:#E9E5F7;
 --ink:#1E1638;--ink-2:#514A6B;--ink-3:#8B85A3;--line:#E6E2F2;--line-2:#D3CDE6;
 --sh1:0 1px 2px rgba(30,22,56,.05);--sh2:0 4px 14px rgba(30,22,56,.07);--sh3:0 12px 34px rgba(30,22,56,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Tajawal','Cairo','Readex Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:96px}
html[lang=en] body{font-family:Inter,'Tajawal','Cairo','Readex Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html[lang=ar] *{letter-spacing:0 !important}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
html[lang=ar] .mono{font-family:'Tajawal','Cairo','Readex Pro',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.3}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.w{max-width:1040px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);
 color:#fff;border:1px solid var(--brand);padding:12px 22px;border-radius:var(--r2);font:inherit;
 font-size:15px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.o{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.o:hover{border-color:var(--ink-3);filter:none}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:8px 16px;font-size:13.5px}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.full{width:100%}
/* ---- shell ---- */
.topbar{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tb{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brandmark{width:120px;height:26px;background-image:var(--logo);background-size:contain;
 background-repeat:no-repeat;background-position:left center;flex:0 0 auto}
html[dir=rtl] .brandmark{background-position:right center}
.tbr{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.chip{background:var(--sunk);border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:12.5px}
.chip.acc{background:#FFF3E9;border-color:#FFD9BF;color:#B44700}
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:50;display:flex;justify-content:center;padding:10px}
.tabs{display:flex;background:var(--brand);border-radius:16px;padding:6px;gap:2px;box-shadow:var(--sh3)}
.tab{border:0;background:none;color:rgba(255,255,255,.72);font:inherit;font-size:11.5px;cursor:pointer;
 padding:9px 14px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.tab svg{width:19px;height:19px}
.tab.on{background:#fff;color:var(--brand);font-weight:600}
/* ---- setup checklist ---- */
.setup{background:var(--brand);color:#fff;padding:12px 0}
.setup .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setup .lbl{font-size:14px;font-weight:600}
.setup .cnt{background:rgba(255,255,255,.16);border-radius:100px;padding:4px 12px;font-size:12.5px}
.pill{background:rgba(255,255,255,.1);border-radius:100px;padding:7px 14px;font-size:12.5px;
 display:flex;align-items:center;gap:7px;white-space:nowrap}
.pill.done{opacity:.5;text-decoration:line-through}
.pill i{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:grid;
 place-items:center;font-size:9px;flex:0 0 auto}
.pill.done i{background:#fff;color:var(--brand);border-color:#fff}
/* ---- panels ---- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r4);padding:20px;
 margin-bottom:16px;box-shadow:var(--sh1)}
.panel h3{margin-bottom:4px}
.hint{color:var(--ink-3);font-size:13px;margin:0 0 14px;line-height:1.7}
.fld{margin-top:14px}
.fld label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.fld .sub{color:var(--ink-3);font-size:12px;margin-top:5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--r2);
 background:var(--paper);color:var(--ink);font:inherit;font-size:15px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,55,87,.1)}
input[type=color]{padding:3px;height:42px;cursor:pointer}
input[type=range]{padding:0;border:0;accent-color:var(--brand)}
input[type=file]{padding:9px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tick{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--ink-2);cursor:pointer}
.tick input{width:18px;height:18px;accent-color:var(--brand);flex:0 0 auto;margin:2px 0 0}
.req{color:#C0392B}
/* choice cards */
.choices{display:grid;gap:12px;margin-top:12px}
@media(min-width:640px){.choices.c2{grid-template-columns:1fr 1fr}.choices.c3{grid-template-columns:repeat(3,1fr)}}
.choice{border:1.5px solid var(--line-2);border-radius:var(--r3);padding:16px;cursor:pointer;transition:.15s;
 background:var(--paper);text-align:start}
.choice:hover{border-color:var(--ink-3)}
.choice.on{border-color:var(--brand);background:#F4F7FB;box-shadow:0 0 0 3px rgba(32,55,87,.08)}
.choice b{display:block;font-size:15px;margin-bottom:3px}
.choice span{color:var(--ink-3);font-size:12.5px;line-height:1.6}
.choice .badge{display:inline-block;background:var(--sunk);border-radius:100px;padding:3px 10px;
 font-size:11px;color:var(--ink-2);margin-bottom:9px}
.choice .badge.acc{background:#FFF3E9;color:#B44700}
/* chips row */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.ch{border:1px solid var(--line-2);background:var(--paper);border-radius:100px;padding:7px 15px;
 font:inherit;font-size:13px;cursor:pointer;color:var(--ink-2)}
.ch:hover{border-color:var(--ink-3)}
.ch.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
/* wizard */
.wizhead{background:var(--brand);color:#fff;position:sticky;top:0;z-index:45}
.wh{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.wh .st{text-align:end}
.wh .st b{display:block;font-size:14.5px}
.wh .st span{font-size:12px;opacity:.75}
.wh .acts{display:flex;gap:10px;align-items:center}
.wh .cancel{color:rgba(255,255,255,.85);font-size:13.5px;text-decoration:underline;cursor:pointer}
.prog{height:3px;background:rgba(255,255,255,.2)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.wizbody{display:grid;gap:24px;padding:24px 0}
@media(min-width:900px){.wizbody{grid-template-columns:340px 1fr;align-items:start}}
.stepnum{color:var(--ink-3);font-size:13px}
.navrow{display:flex;gap:10px;margin-top:22px}
/* pass preview */
.pvwrap{position:sticky;top:80px}
.wtog{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.wtog button{border:1px solid var(--line-2);background:var(--paper);border-radius:100px;padding:6px 14px;
 font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.wtog button.on{background:var(--paper);border-color:var(--brand);color:var(--ink);font-weight:600;box-shadow:var(--sh1)}
.pass{border-radius:var(--r4);overflow:hidden;box-shadow:var(--sh3);max-width:320px;margin:0 auto}
.p-hd{padding:12px 14px;display:flex;align-items:center;gap:9px}
.p-lg{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.22);background-size:cover;
 background-position:center;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700}
.p-nm{font-size:14.5px;font-weight:600}
.p-cov{position:relative;background-size:cover;background-position:center;padding:14px 12px;min-height:96px;
 display:flex;align-items:center;justify-content:center}
.p-st{display:grid;gap:8px;position:relative;width:100%}
.p-st i{aspect-ratio:1;display:grid;place-items:center;font-size:15px;border-width:2px;border-style:solid}
.p-fields{display:flex;justify-content:space-between;padding:12px 14px;gap:12px}
.p-f small{display:block;font-size:9px;letter-spacing:.12em;opacity:.8;text-transform:uppercase}
.p-f b{display:block;font-size:17px;font-weight:400;margin-top:2px}
.p-qr{background:#fff;margin:0 14px 14px;padding:9px;border-radius:6px;display:grid;place-items:center}
.p-qr canvas{width:100px;height:100px;image-rendering:pixelated;display:block}
.p-qr span{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#111;margin-top:4px}
.p-back{background:#fff;color:#111;padding:14px;font-size:12px}

<script>// Minimal but CORRECT QR encoder — byte mode, ECC level L, versions 1..4 (single block).
function qrMatrix(text, forceMask){
  const CAP = {1:19, 2:34, 3:55, 4:80};      // data codewords, ECC-L
  const ECW = {1:7, 2:10, 3:15, 4:20};       // ec codewords, ECC-L
  const bytes = [...new TextEncoder().encode(text)];
  let ver = 0;
  for (const v of [1,2,3,4]) if (bytes.length + 2 <= CAP[v]) { ver = v; break; }
  if (!ver) throw new Error("too long");
  const size = 17 + 4*ver, cap = CAP[ver], ecn = ECW[ver];

  // ---- bit stream: mode(0100) + count(8) + data ----
  const bits = [];
  const put = (val, len) => { for (let i = len-1; i >= 0; i--) bits.push((val>>i)&1); };
  put(0b0100, 4); put(bytes.length, 8);
  for (const b of bytes) put(b, 8);
  put(0, Math.min(4, cap*8 - bits.length));           // terminator
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8)
    data.push(bits.slice(i, i+8).reduce((a,b)=>(a<<1)|b, 0));
  const PAD = [0xEC, 0x11];
  for (let i = 0; data.length < cap; i++) data.push(PAD[i%2]);

  // ---- Reed-Solomon over GF(256), primitive 0x11D ----
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++){ EXP[i]=x; LOG[x]=i; x<<=1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i-255];
  const mul = (a,b) => (a===0||b===0) ? 0 : EXP[LOG[a]+LOG[b]];
  let gen = [1];
  for (let i = 0; i < ecn; i++){
    const next = new Array(gen.length+1).fill(0);
    for (let j = 0; j < gen.length; j++){
      next[j]   ^= gen[j];
      next[j+1] ^= mul(gen[j], EXP[i]);
    }
    gen = next;
  }
  const rem = new Array(ecn).fill(0);
  for (const d of data){
    const factor = d ^ rem[0];
    rem.shift(); rem.push(0);
    for (let j = 0; j < ecn; j++) rem[j] ^= mul(gen[j+1], factor);
  }
  const all = [...data, ...rem];

  // ---- matrix ----
  const m = Array.from({length:size}, () => new Array(size).fill(null));
  const set = (r,c,v) => { if (r>=0 && r<size && c>=0 && c<size) m[r][c] = v; };

  const finder = (r,c) => {
    for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++){
      const inside = i>=0 && i<7 && j>=0 && j<7;
      const dark = inside && (i===0||i===6||j===0||j===6 || (i>=2&&i<=4&&j>=2&&j<=4));
      set(r+i, c+j, dark ? 1 : 0);
    }
  };
  finder(0,0); finder(0,size-7); finder(size-7,0);

  for (let i = 8; i < size-8; i++){ const b = i%2===0?1:0; set(6,i,b); set(i,6,b); } // timing

  if (ver >= 2){                                                   // alignment
    const c = {2:18, 3:22, 4:26}[ver];
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++)
      set(c+i, c+j, (Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0)) ? 1 : 0);
  }
  set(size-8, 8, 1);                                               // dark module
  for (let i = 0; i < 9; i++){                                     // format reserve
    if (m[8][i]===null) set(8,i,0);
    if (m[i][8]===null) set(i,8,0);
  }
  for (let i = 0; i < 8; i++){ set(8, size-1-i, 0); set(size-1-i, 8, 0); }

  // ---- data placement (zigzag, upward/downward columns) ----
  const mask = forceMask ?? 0;
  const MASKS = [
    (r,c)=>(r+c)%2===0, (r,c)=>r%2===0, (r,c)=>c%3===0, (r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0, (r,c)=>((r*c)%2)+((r*c)%3)===0,
    (r,c)=>(((r*c)%2)+((r*c)%3))%2===0, (r,c)=>(((r+c)%2)+((r*c)%3))%2===0,
  ];
  let bi = 0, up = true;
  for (let col = size-1; col > 0; col -= 2){
    if (col === 6) col--;                                          // skip timing column
    for (let k = 0; k < size; k++){
      const row = up ? size-1-k : k;
      for (const c of [col, col-1]){
        if (m[row][c] !== null) continue;
        let bit = 0;
        if (bi < all.length*8) bit = (all[bi>>3] >> (7-(bi&7))) & 1;
        bi++;
        m[row][c] = MASKS[mask](row,c) ? bit^1 : bit;
      }
    }
    up = !up;
  }

  // ---- format info: ECC L = 01, BCH(15,5) ----
  const fmtData = (0b01 << 3) | mask;
  let v = fmtData << 10;
  for (let i = 4; i >= 0; i--) if ((v >> (i+10)) & 1) v ^= 0b10100110111 << i;
  const fmt = ((fmtData << 10) | v) ^ 0b101010000010010;
  for (let i = 0; i < 15; i++){
    const b = (fmt >> i) & 1;
    // vertical strip (top-left column, then bottom-left)
    if (i < 6)      set(i, 8, b);
    else if (i < 8) set(i+1, 8, b);
    else            set(size-15+i, 8, b);
    // horizontal strip (top-right row, then top-left)
    if (i < 8)      set(8, size-1-i, b);
    else if (i === 8) set(8, 7, b);
    else            set(8, 14-i, b);
  }
  set(size-8, 8, 1);
  return m;
}</script>

/* ============ boot ============ */
function boot(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=L[S.lang].dir;
  if(S.theme==="violet")document.documentElement.dataset.theme="violet";
  else document.documentElement.removeAttribute("data-theme");
  render();
}
function go(scr){S.screen=scr;window.scrollTo(0,0);render()}
function toast(m){$("toast").textContent=m;$("toast").classList.add("on");
 setTimeout(()=>$("toast").classList.remove("on"),2200)}
function toggleLang(){S.lang=S.lang==="ar"?"en":"ar";boot()}
function toggleTheme(){S.theme=S.theme==="violet"?"navy":"violet";boot()}

/* ============ render ============ */
function render(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=L[S.lang].dir;
  const R={login:vLogin,onboard:vOnboard,app:vApp,wizard:vWizard,done:vDone,cust:vCust};
  $("root").innerHTML=(R[S.screen]||vLogin)();
  $("flowbar").innerHTML=flowbar();
  if(S.screen==="app"||S.screen==="wizard"||S.screen==="done")afterApp();
  if(S.screen==="cust")afterCust();
}
function flowbar(){
  const steps=[["login","f_land"],["onboard","f_ob"],["app","f_app"],["cust","f_cust"]];
  return `<b>${t("flow")}</b>`+steps.map(([s,k],i)=>
   `<button class="${S.screen===s?"on":""}" onclick="${s==='cust'?'openCust()':`go('${s}')`}">${n(i+1)} ${t(k)}</button>`).join("")
   +`<button onclick="location.reload()">${t("reset")}</button>`
   +`<button onclick="toggleTheme()">${S.theme==="violet"?"◑ Navy":"◐ Violet"}</button>`
   +`<button onclick="toggleLang()">${S.lang==="ar"?"EN":"ع"}</button>`;
}

/* ---------- pass preview ---------- */
function passHTML(c,filled,forCust){
  const cols=c.goal>6?4:c.goal>3?Math.ceil(c.goal/1):c.goal;
  const per=c.goal<=5?c.goal:Math.ceil(c.goal/2);
  const rad=c.shape==="circle"?"50%":"22%";
  const left=Math.max(0,c.goal-filled);
  const stamps=Array.from({length:c.goal},(_,i)=>{
    const on=i<filled;
    return `<i style="border-radius:${rad};border-color:${on?c.stampActive:c.stampInactive};
      background:${on?c.stampActive:"transparent"};color:${on?c.bg:c.stampInactive}">${c.icon}</i>`}).join("");
  const logo=c.logo?`background-image:url(${c.logo})`:"";
  if(S.showBack&&!forCust) return `<div class="pass"><div class="p-back">
    <div style="text-align:center;font-weight:700;margin-bottom:10px">${esc(c.name||"—")}</div>
    <div class="r"><b>${t("rw_reward")}</b><span>${esc(c.reward||"—")}</span></div>
    <div class="r"><b>${t("rw_earn")}</b><span>${t("pervisit")}</span></div>
    <div class="r"><b>${t("rw_company")}</b><span>${esc(S.me?S.me.name:"")}</span></div>
    <div style="margin-top:12px"><b style="font-size:10px;letter-spacing:.08em">${t("rw_terms")}</b>
     <ol><li>${t("t_1")}</li><li>${t("t_2",{n:c.goal})}</li><li>${t("t_3")}</li>
      <li>${t("t_4")}</li><li>${t("t_5")}</li><li>${t("t_6")}</li></ol></div>
   </div></div>`;
  return `<div class="pass" style="background:${c.bg};color:${c.fg}">
   <div class="p-hd"><div class="p-lg" style="${logo}">${c.logo?"":esc((c.name||"L").slice(0,2))}</div>
    <div class="p-nm">${esc(c.name||"—")}</div></div>
   <div class="p-cov" style="background:${c.bg}">
    <div class="p-st" style="grid-template-columns:repeat(${per},1fr)">${stamps}</div></div>
   <div class="p-fields">
    <div class="p-f"><small>${t("rewardsav")}</small><b>${n(0)}</b></div>
    <div class="p-f" style="text-align:end"><small>${t("stampsleft")}</small><b>${n(left)}</b></div></div>
   <div class="p-qr"><canvas id="pq_${forCust?"c":"w"}" width="240" height="240"></canvas>
    <span>${c.code||"PREVIEW"}</span></div>
  </div>`}
function drawQR(id,text){const cv=$(id);if(!cv)return;const x=cv.getContext("2d");
 let m;try{m=qrMatrix(text,0)}catch(e){return}
 const N=m.length,p=Math.floor(cv.width/(N+6)),o=Math.floor((cv.width-p*N)/2);
 x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#000";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(m[r][c])x.fillRect(o+c*p,o+r*p,p,p)}

function pStamp(){return `<div class="scan">
  <h2>${t("stamp_h")}</h2><p class="hint">${t("stamp_p")}</p>
  <div class="panel">
   <button class="btn o full" id="camb" onclick="scan()">📷 ${t("startcam")}</button>
   <video id="vid" playsinline muted style="width:100%;border-radius:var(--r3);background:#000;display:none;margin-top:12px"></video>
   <div class="fld"><label>${t("manual")}</label><input id="ser" placeholder="A74CF50B"></div>
   <button class="btn full" style="margin-top:12px" onclick="doStamp()">${t("dostamp")}</button>
   <div id="sres"></div>
  </div></div>`}
let stream=null,loop=null,last=0;
async function scan(){
  if(stream){clearInterval(loop);stream.getTracks().forEach(x=>x.stop());stream=null;
   $("vid").style.display="none";$("camb").textContent="📷 "+t("startcam");return}
  if(!("BarcodeDetector" in window)){toast("BarcodeDetector ✗");return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}catch(e){toast("✗");return}
  $("vid").srcObject=stream;$("vid").style.display="block";$("vid").play();
  $("camb").textContent="⏹ "+t("stopcam");
  const det=new BarcodeDetector({formats:["qr_code"]});
  loop=setInterval(async()=>{try{const c=await det.detect($("vid"));
   if(c.length&&Date.now()-last>2500){last=Date.now();navigator.vibrate&&navigator.vibrate(60);doStamp(c[0].rawValue)}}catch(e){}},350)}
function doStamp(code){
  const v=(code||($("ser")||{}).value||"").trim();if(!v)return;
  const p=S.passes.find(x=>x.code===v||x.serial===v);
  if(!p){$("sres").innerHTML=`<div class="res no">${t("unknown")}</div>`;return}
  if(p.lastAt&&Date.now()-p.lastAt<24*3600e3){$("sres").innerHTML=`<div class="res no">${t("guard")}</div>`;return}
  const c=S.cards[0];
  p.stamps++;p.visits++;p.lastAt=Date.now();
  p.last=S.lang==="ar"?`${n(new Date().getDate())} أغسطس`:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  S.events.push({kind:"stamp"});
  let won=false;
  if(p.stamps>=c.goal){p.stamps=0;p.rewards++;won=true;S.events.push({kind:"reward"})}
  $("sres").innerHTML=`<div class="res ok">${won?"🎁 "+t("rewardwon"):"✓ "+t("stamped")+" — "+n(p.stamps)+"/"+n(c.goal)}</div>`;
}

function afterCust(){
  const p=S.passes.find(x=>x.serial===S.cust.serial);
  if(p)drawQR("pq_c",p.code);
}
window.S=S;window.render=render;window.go=go;window.t=t;window.n=n;
boot();
</script>
