name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '25' }
      - run: npm ci
      - name: Secrets must never be tracked
        run: |
          if git ls-files | grep -E '(^certs/|\.env$|\.pem$|\.p8$|\.cer$|\.p12$|\.mobileprovision$|\.pkpass$|service-account.*\.json$)'; then
            echo "::error::secret material is tracked in git"; exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:i18n
