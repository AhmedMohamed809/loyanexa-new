<style>
/* ============================================================
   LoyaNexa — design tokens
   Palette is pinned by the brief; the punch-card stamp grid is
   the structural motif that runs through every surface.
   ============================================================ */
:root{
  /* accent — soft, warm, used sparingly ------------------------ */
  --accent:#F28C38;
  --accent-hover:#E67E22;
  --accent-light:#F7B267;
  --accent-t:rgba(242,140,56,.10);
  --accent-line:rgba(242,140,56,.28);
  /* 7.30:1 against the accent. White would be 2.45:1 and fail AA.
     Flip this one token to #FFFFFF if you want white regardless.  */
  --on-accent:#0F172A;

  /* navy — the dominant 80-85% ---------------------------------- */
  --canvas:#0F172A;
  --sunk:#162338;
  --paper:#1C2A42;
  --raise:#22314C;
  --navy:#0F172A; --navy-2:#162338; --navy-3:#1C2A42;

  /* text --------------------------------------------------------- */
  --ink:#FFFFFF;
  --ink-2:#CBD5E1;
  --ink-3:#94A3B8;

  /* lines and glass ---------------------------------------------- */
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --glass:rgba(15,23,42,.78);
  --glass-2:rgba(28,42,66,.55);
  --glass-line:rgba(255,255,255,.09);

  /* gradients — navy only, no orange fields ----------------------- */
  --grad-hero:linear-gradient(180deg,#0F172A 0%,#162338 100%);
  --grad-navy:linear-gradient(160deg,#22314C 0%,#1C2A42 45%,#162338 100%);
  --grad-card:linear-gradient(160deg,rgba(255,255,255,.035),transparent 58%);

  /* shadows — soft only, no glow ---------------------------------- */
  --sh-1:0 1px 2px rgba(0,0,0,.28);
  --sh-2:0 2px 8px rgba(0,0,0,.24), 0 10px 24px -14px rgba(0,0,0,.5);
  --sh-3:0 4px 14px rgba(0,0,0,.28), 0 22px 48px -22px rgba(0,0,0,.6);
  --sh-btn:0 2px 8px rgba(242,140,56,.22);
  --sh-btn-h:0 6px 18px -4px rgba(242,140,56,.30);

  /* status -------------------------------------------------------- */
  --green:#22C55E; --red:#EF4444; --amber:#F7B267;

  /* shape and motion ---------------------------------------------- */
  --r-sm:10px; --r-md:14px; --r-lg:16px; --r-xl:18px; --r-2xl:22px;
  --sans:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;   /* label/figure role, same family */
  --shell:1200px; --t:300ms;
  --ease:cubic-bezier(.22,1,.36,1); --ease-2:cubic-bezier(.4,0,.2,1);

  /* aliases so existing rules keep resolving ---------------------- */
  --orange:var(--accent); --orange-hi:var(--accent-light); --orange-lo:var(--accent-hover);
  --orange-t:var(--accent-t); --orange-glow:rgba(242,140,56,.20);
  --on-orange:var(--on-accent); --logo-orange:#F28C38; --card-navy:#162338;
  --brand-bg:var(--accent); --brand-fg:var(--on-accent); --brand-hover:var(--accent-hover);
  --grad-brand:linear-gradient(135deg,#F7B267 0%,#F28C38 60%,#E67E22 100%);
  --sh-brand:var(--sh-btn); --sh-glow:var(--sh-2);
  --indigo:var(--accent); --indigo-600:var(--accent-hover); --indigo-050:var(--accent-t);
  --violet:var(--accent-light); --violet-050:rgba(247,178,103,.10);

  /* the former six-hue family collapses to navy tints + one accent,
     so the interface reads navy-dominant instead of multicoloured    */
  --c-teal:#CBD5E1;   --c-teal-t:rgba(203,213,225,.09);
  --c-olive:#94A3B8;  --c-olive-t:rgba(148,163,184,.09);
  --c-brass:#F7B267;  --c-brass-t:rgba(247,178,103,.10);
  --c-clay:#F28C38;   --c-clay-t:rgba(242,140,56,.10);
  --c-plum:#A8B6CC;   --c-plum-t:rgba(168,182,204,.09);
  --c-denim:#8FA6C4;  --c-denim-t:rgba(143,166,196,.09);
  --c-orange:#F28C38; --c-orange-t:rgba(242,140,56,.10);
}
/* IBM Plex Sans Arabic is bilingual, so no per-language family swap is required.
   Arabic still gets a little more leading — its ascenders/descenders run deeper. */
html[lang="ar"] body{line-height:1.75}
/* BUILD.md §4, non-negotiable: tracking breaks Arabic letter joining. A few
   components below carry their own html[lang="ar"] override that zeroes
   (or softens) their own letter-spacing; this global !important rule is the
   backstop so no component can miss it — see docs/COPY.md. */
html[lang="ar"] *{letter-spacing:0!important}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-size:16px;font-weight:400;line-height:1.65;
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.skip{position:absolute;inset-inline-start:-9999px;top:12px;z-index:999;padding:10px 18px;
  border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font-weight:700}
.skip:focus{inset-inline-start:12px}
::selection{background:var(--accent);color:var(--on-accent)}

/* type scale ------------------------------------------------ */
.display{font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.04;letter-spacing:-.025em;font-weight:700}
.h2{font-size:clamp(1.8rem,3.9vw,2.8rem);line-height:1.14;letter-spacing:-.02em;font-weight:700}
.h3{font-size:clamp(1.12rem,2vw,1.38rem);line-height:1.3;letter-spacing:-.01em;font-weight:700}
.lede{font-size:clamp(1rem,1.55vw,1.16rem);line-height:1.7;font-weight:400;color:var(--ink-2)}
.small{font-size:.875rem;line-height:1.5;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum' 1;letter-spacing:-.01em}
html[lang="ar"] .display{letter-spacing:0;line-height:1.28}
html[lang="ar"] .h2{letter-spacing:0;line-height:1.3}
html[lang="ar"] .h3{letter-spacing:0;line-height:1.5}

/* eyebrow: a stamp card in miniature -------------------------- */
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:.72rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow i{display:block;width:24px;height:7px;border-radius:99px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 4px,transparent 4px 8px)}

/* buttons ---------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;
  border-radius:var(--r-md);font-weight:600;font-size:.92rem;letter-spacing:0;
  transition:background 150ms ease,border-color 150ms ease,color 150ms ease,
             box-shadow 150ms ease,transform 150ms ease;
  white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-btn);font-weight:600}
.btn-primary:hover{background:var(--accent-hover);box-shadow:var(--sh-btn-h)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-t)}
.btn-quiet{color:var(--ink-2);height:40px;padding:0 12px;border-radius:var(--r-sm)}
.btn-quiet:hover{background:var(--sunk);color:var(--accent)}
.btn-sm{height:36px;padding:0 14px;font-size:.85rem;border-radius:var(--r-sm)}
.btn-lg{height:54px;padding:0 26px;font-size:1rem;border-radius:var(--r-lg)}
.btn-block{width:100%}

/* surfaces --------------------------------------------------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-1)}
.shell{width:min(100% - 40px,var(--shell));margin-inline:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;
  font-size:.73rem;font-weight:600;letter-spacing:.01em}
.pill-green{background:rgba(34,197,94,.13);color:#4ADE80}
.pill-amber{background:rgba(247,178,103,.13);color:var(--accent-light)}
.pill-red{background:rgba(239,68,68,.13);color:#F87171}
.pill-indigo{background:var(--accent-t);color:var(--accent)}

/* the signature motif: a row of stamp slots ------------------- */
.stamps{display:flex;gap:6px;align-items:center}
.stamps s{width:9px;height:9px;border-radius:99px;background:currentColor;opacity:.16;text-decoration:none}
.stamps s.on{opacity:1}
.rule{height:1px;border:0;background:var(--line);margin:0}
.rule-punched{height:1px;border:0;margin:0;
  background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}

/* motion ----------------------------------------------------- */
/* Content ships visible. Only once JS confirms IntersectionObserver do we
   hide it to animate in — so a JS failure never leaves a blank page. */
.rise{opacity:1;transform:none}
html.anim .rise{opacity:0;transform:translateY(24px);will-change:opacity,transform}
html.anim .rise.in{opacity:1;transform:none;
  transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
html.anim .rise.done{will-change:auto}
html.anim .rise-scale{transform:translateY(24px) scale(.96)}
html.anim .rise-scale.in{transform:none;
  transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    animation-delay:0ms !important;transition-duration:.001ms !important;transition-delay:0ms !important;
    scroll-behavior:auto !important}
  html.anim .rise,html.anim .rise.in{opacity:1 !important;transform:none !important;will-change:auto !important}
  html.anim .iphone{animation:none !important;transform:none !important;
    transition:none !important;will-change:auto !important}
  .ip-glare{display:none}
  .slot.pop,.slot.pop::after,.lc-swap,.scan-line{animation:none !important}
  .slots::after{transition:none !important}
  .qa .wrap{transition:none}
  .mobmenu,.mob-scrim{transition:none}
}
</style>
<style>
/* ============================================================
   Marketing site
   ============================================================ */
.topbar{position:sticky;top:0;z-index:60;background:transparent;
  border-bottom:1px solid transparent;
  transition:background 200ms ease,backdrop-filter 200ms ease,border-color 200ms ease}
.topbar.stuck{background:var(--glass);border-bottom-color:var(--glass-line);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.topbar-in{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.03em;font-size:1.06rem}
.lockup{display:inline-flex;align-items:center;flex:none}
.lockup img{display:block;width:auto}
.mark{color:var(--accent)}
.mark{width:32px;height:32px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);
  display:grid;place-items:center;flex:none}
.mark svg{width:19px;height:19px}
.mark svg{width:17px;height:17px}
.nav{display:flex;gap:2px;margin-inline-start:18px}
.nav a{padding:8px 12px;border-radius:var(--r-sm);font-size:.9rem;font-weight:500;color:var(--ink-2);
  transition:background .16s,color .16s}
.nav a:hover{background:var(--sunk);color:var(--accent)}
.topbar-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);
  border:1px solid transparent;transition:background .16s,color .16s,border-color .16s}
.icon-btn:hover{background:var(--sunk);color:var(--accent)}
.lang-btn{width:auto;padding:0 11px;gap:6px;font-size:.83rem;font-weight:600;font-family:var(--mono)}
@media (max-width:900px){.nav{display:none}}
@media (max-width:520px){.hide-xs{display:none}}

/* hero ------------------------------------------------------- */
.hero{position:relative;padding:88px 0 56px;overflow:hidden;border-bottom:1px solid var(--line);
  background:var(--grad-hero)}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:72px 72px;
  -webkit-mask-image:radial-gradient(80% 62% at 50% 0%,#000,transparent 76%);
  mask-image:radial-gradient(80% 62% at 50% 0%,#000,transparent 76%)}

.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center}
@media (max-width:980px){.hero-in{grid-template-columns:1fr;gap:44px}.hero{padding-top:52px}}
.hero h1{margin:18px 0 16px;max-width:14ch}
.hero .lede{max-width:46ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-note{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:22px;font-size:.83rem;color:var(--ink-3)}
.hero-note span{display:inline-flex;align-items:center;gap:7px}
.tick{width:16px;height:16px;border-radius:99px;background:rgba(34,197,94,.14);color:var(--green);
  display:grid;place-items:center;flex:none}
.tick svg{width:9px;height:9px}

/* the loyalty card — portrait membership card ------------------ */
.loyalty{position:relative;width:100%;max-width:360px;margin-inline:auto;
  border-radius:var(--r-2xl);overflow:hidden;color:#fff;
  background:var(--paper);border:1px solid var(--line-2);box-shadow:var(--sh-3);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease)}

/* 1 — wordmark header */
.lc-head{padding:22px 20px 18px;text-align:center}
.lc-head b{display:block;font-size:1.02rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-light);line-height:1.3}
html[lang="ar"] .lc-head b{letter-spacing:0;text-transform:none;font-size:1.12rem}

/* 2 — feature band with the stamp row over it */
.lc-band{position:relative;padding:34px 16px 16px;background:var(--band,var(--grad-navy));
  border-block:1px solid var(--line)}
.lc-band::before{content:"";position:absolute;inset:0;opacity:.9;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.09),transparent 60%),
             radial-gradient(90% 70% at 50% 108%,rgba(242,140,56,.16),transparent 66%)}
.lc-band::after{content:"";position:absolute;inset:0;opacity:.09;
  background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);background-size:13px 13px}
.slots{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,1fr);
  gap:6px;align-items:center;justify-items:center}
.slots::before{content:"";position:absolute;top:50%;inset-inline:11%;height:1.5px;
  background:rgba(255,255,255,.18);transform:translateY(-50%)}
/* the lit portion of the rail grows with the stamp count.
   scaleX, never width — transform only, per the motion contract. */
.slots::after{content:"";position:absolute;top:50%;inset-inline:11%;height:1.5px;
  background:var(--accent);transform-origin:left center;
  transform:translateY(-50%) scaleX(var(--fill,0));
  transition:transform .5s cubic-bezier(.22,1,.36,1);will-change:transform}
html[dir="rtl"] .slots::after{transform-origin:right center}

/* a stamp lands: scale pop plus a single ring pulse, both transform/opacity only */
.slot.filled::after{content:"";position:absolute;inset:-4px;border-radius:99px;
  border:2px solid var(--accent);opacity:0}
.slot.pop::after{animation:ring .5s var(--ease)}
@keyframes ring{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
.slot{position:relative;z-index:1;width:100%;max-width:56px;aspect-ratio:1;border-radius:99px;
  border:1.5px solid rgba(255,255,255,.28);background:var(--canvas);
  display:grid;place-items:center;color:rgba(255,255,255,.45);
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),
             color var(--t) var(--ease),transform var(--t) var(--ease)}
.slot svg{width:52%;height:52%}
.slot.filled{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.04)}
.slot.pop{animation:pop .4s var(--ease)}
.lc-swap{animation:lc-swap .45s var(--ease)}
@keyframes lc-swap{0%{opacity:0;transform:translateY(10px) scale(.985)}100%{opacity:1;transform:none}}

/* 3 — the two readings under the band */
.lc-under{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin-top:20px;text-align:center;font-size:.8rem}
.lc-under span{display:block;color:rgba(255,255,255,.72)}
.lc-under b{display:block;font-weight:700;font-size:.94rem;margin-top:3px}

/* 4 — stat tiles */
.lc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.lc-tiles > div{padding:13px 14px;border-radius:var(--r-md);background:var(--sunk);
  border:1px solid var(--line)}
.lc-tiles .t{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:.66rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
html[lang="ar"] .lc-tiles .t{letter-spacing:0;text-transform:none;font-size:.72rem}
.lc-tiles .t svg{color:var(--accent);flex:none}
.lc-tiles b{display:block;margin-top:6px;font-size:1.15rem;font-weight:700;letter-spacing:-.02em;
  color:var(--accent-light)}

/* 5 — scan block */
.lc-scan{display:grid;place-items:center;gap:9px;padding:4px 16px 18px}
.lc-scan .box{position:relative;background:#fff;color:#0F172A;padding:11px 11px 26px;border-radius:14px;
  border:1px solid rgba(15,23,42,.10)}
.lc-scan .box .qr{width:104px;max-width:104px}
.lc-scan .scanlbl{position:absolute;inset-inline:0;bottom:7px;text-align:center;color:#0F172A;
  font-size:.72rem;font-weight:700;letter-spacing:.18em}
html[lang="ar"] .lc-scan .scanlbl{letter-spacing:.04em}
.lc-scan .code{font-size:.78rem;font-weight:600;letter-spacing:.12em;color:var(--ink-2)}
html[lang="ar"] .lc-scan .code{letter-spacing:.06em}

/* 6 — contact rail */
.lc-foot{padding:11px 16px 15px;border-top:1px solid var(--line);text-align:center;
  font-size:.68rem;color:var(--ink-3);line-height:1.5}
.lc-foot i{font-style:normal;opacity:.4;margin-inline:5px}

/* card caption */
.card-cap{display:flex;justify-content:center;gap:22px;margin-top:18px;font-size:.8rem;color:var(--ink-3)}
.card-cap b{color:var(--ink);font-weight:600}

/* tagline strip ----------------------------------------------- */
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;margin-top:60px}
.triad > div{background:var(--paper);padding:26px 24px}
.triad .seal{width:46px;height:46px;border-radius:99px;display:grid;place-items:center;
  color:var(--accent);background:var(--accent-t);border:1px solid var(--accent-line);margin:0 0 20px}
.triad b{display:block;font-size:clamp(1.4rem,2.6vw,1.8rem);line-height:1.1;font-weight:700;
  letter-spacing:-.035em;margin-bottom:9px}
.triad span{font-size:.875rem;color:var(--ink-3);line-height:1.5}
html[lang="ar"] .triad b{letter-spacing:0;line-height:1.3}

/* ================================================================
   Shared iPhone shell — used by every card mock and the scanner
   ================================================================ */
/* 3D: the shell owns the perspective, the phone owns the rotation.
   Keeping them on separate elements lets the hero float and the tilt
   coexist without fighting over one transform. */
.ip-shell{position:relative;width:100%;max-width:288px;margin-inline:auto;
  perspective:1100px;perspective-origin:50% 45%}
@media (max-width:420px){.ip-shell{max-width:262px}}
.iphone{position:relative;width:100%;max-width:none;aspect-ratio:1/2.03;margin-inline:auto;
  transform-style:preserve-3d;
  transition:transform 420ms cubic-bezier(.22,1,.36,1);
  border-radius:44px;border:9px solid #05090F;background:var(--canvas);overflow:hidden;
  box-shadow:var(--sh-3),0 0 0 1px rgba(255,255,255,.07)}
/* Autonomous 3D drift. Two counter-phased keyframes so neighbouring
   phones never swing in lockstep; the pointer tilt takes over on hover. */
@keyframes drift-a{
   0%{transform:rotateY(-7deg) rotateX(2.5deg) translateY(0)}
  25%{transform:rotateY(-1deg) rotateX(-2deg)  translateY(-7px)}
  50%{transform:rotateY(7deg)  rotateX(2.5deg) translateY(0)}
  75%{transform:rotateY(-1deg) rotateX(4deg)   translateY(5px)}
 100%{transform:rotateY(-7deg) rotateX(2.5deg) translateY(0)}
}
@keyframes drift-b{
   0%{transform:rotateY(6deg)  rotateX(-2deg)  translateY(3px)}
  25%{transform:rotateY(0deg)  rotateX(3deg)   translateY(-5px)}
  50%{transform:rotateY(-6deg) rotateX(-2deg)  translateY(3px)}
  75%{transform:rotateY(1deg)  rotateX(-3.5deg) translateY(-2px)}
 100%{transform:rotateY(6deg)  rotateX(-2deg)  translateY(3px)}
}
html.anim .iphone{animation:drift-a 14s ease-in-out infinite var(--drift-delay,0s);will-change:transform}
html.anim .ip-shell.alt .iphone{animation-name:drift-b;animation-duration:16s}

/* while the pointer drives it, the drift stands down and tracking is 1:1 */
.iphone.tilting{animation:none !important;transition:none}
/* on release it eases home, then the drift picks up again */
.iphone.settling{animation:none !important}

/* a soft sheen that follows the tilt — sells the third dimension */
.ip-glare{position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;opacity:0;
  background:linear-gradient(var(--ga,100deg),transparent 34%,rgba(255,255,255,.14) 50%,transparent 66%);
  transition:opacity 300ms ease}
.ip-shell:hover .ip-glare{opacity:1}

/* a lit rim on the bezel, so the edge reads as a physical edge */
.ip-edge{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.05);}

/* depth: the screen and the island sit slightly proud of the bezel */
.ip-screen{transform:translateZ(1px)}
.ip-island{transform:translateX(-50%) translateZ(6px)}

/* iOS status bar */
.ip-status{position:absolute;inset-inline:0;top:0;height:42px;z-index:4;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  font-size:.7rem;font-weight:700;color:var(--ink)}
.ip-status.on-photo{color:#fff}
.ip-island{position:absolute;top:8px;inset-inline-start:50%;transform:translateX(-50%);
  width:72px;height:21px;border-radius:99px;background:#000;display:flex;align-items:center;
  justify-content:flex-end;padding-inline-end:13px}
.ip-island i{width:6px;height:6px;border-radius:99px;background:#3FD68C;display:block}
.ip-sig{display:flex;align-items:center;gap:5px}
.ip-batt{width:20px;height:10px;border-radius:3px;border:1.2px solid currentColor;
  padding:1.4px;display:block;opacity:.75}
.ip-batt i{display:block;height:100%;border-radius:1px;background:currentColor}
.ip-batt.low i{background:var(--red)}

/* the screen itself */
.ip-screen{position:absolute;inset:42px 0 0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;-ms-overflow-style:none}
.ip-screen::-webkit-scrollbar{display:none}
.ip-pad{padding:6px 10px 26px}

/* home indicator */
.ip-home{position:absolute;inset-inline:0;bottom:7px;z-index:5;display:grid;place-items:center;
  pointer-events:none}
.ip-home i{width:96px;height:4px;border-radius:99px;background:currentColor;opacity:.35;display:block}

/* a card sitting inside the shell drops its own frame width */
.ip-screen .loyalty{max-width:none;border-radius:var(--r-xl);box-shadow:none}


/* ---- scanner: the same shell, camera mode ---------------------- */
.scan .ip-screen{inset:0}
/* the hwcard tooltip sits above the shell, not the phone */
.hwcard .ip-shell{max-width:288px}
.scan-feed{position:absolute;inset:0;bottom:84px;
  background:
    radial-gradient(38% 26% at 22% 24%,rgba(255,255,255,.09),transparent 70%),
    radial-gradient(30% 20% at 74% 58%,rgba(255,255,255,.07),transparent 70%),
    radial-gradient(46% 30% at 46% 84%,rgba(242,140,56,.14),transparent 72%),
    linear-gradient(165deg,#3A4150 0%,#2B313D 45%,#1E232C 100%);
  filter:blur(1px)}
.scan-feed::after{content:"";position:absolute;inset:0;opacity:.5;
  background:radial-gradient(120% 80% at 50% 40%,transparent 30%,rgba(0,0,0,.55) 100%)}
.scan-close{position:absolute;top:50px;inset-inline-start:16px;z-index:5;
  width:30px;height:30px;border-radius:99px;border:2px solid var(--red);color:var(--red);
  display:grid;place-items:center;background:rgba(0,0,0,.25)}
.scan-reticle{position:absolute;top:44%;inset-inline-start:50%;
  transform:translate(-50%,-50%);width:56%;aspect-ratio:1;z-index:3}
html[dir="rtl"] .scan-reticle{transform:translate(50%,-50%)}
.scan-corner{position:absolute;width:34%;height:34%;border:3px solid var(--accent)}
.sc-tl{top:0;inset-inline-start:0;border-inline-end:0;border-bottom:0;border-start-start-radius:10px}
.sc-tr{top:0;inset-inline-end:0;border-inline-start:0;border-bottom:0;border-start-end-radius:10px}
.sc-bl{bottom:0;inset-inline-start:0;border-inline-end:0;border-top:0;border-end-start-radius:10px}
.sc-br{bottom:0;inset-inline-end:0;border-inline-start:0;border-top:0;border-end-end-radius:10px}
.scan-line{position:absolute;inset-inline:2%;top:50%;height:3px;border-radius:99px;background:#fff;
  box-shadow:0 0 10px rgba(255,255,255,.5);transform:translateY(-50%)}
html.anim .scan.play .scan-line{animation:sweep 1.5s cubic-bezier(.45,0,.55,1) 3}
@keyframes sweep{
  0%{transform:translateY(-50%) translateY(-44px)}

function lnxSetCookie(name, value){
  const maxAge = 60*60*24*365; // ~1 year
  document.cookie = name+'='+encodeURIComponent(value)+'; path=/; max-age='+maxAge+'; SameSite=Lax';
}
function lnxGetCookie(name){
  const needle = name+'=';
  const parts = document.cookie ? document.cookie.split('; ') : [];
  for(const part of parts){
    if(part.indexOf(needle)===0) return decodeURIComponent(part.slice(needle.length));
  }
  return undefined;
}

/* tiny chart helpers ---------------------------------------- */
function areaPath(data,w,h,pad=0){
  const mx=Math.max(...data),mn=Math.min(...data)*0.82;
  const x=i=>pad+i*(w-pad*2)/(data.length-1);
  const y=v=>h-pad-((v-mn)/(mx-mn))*(h-pad*2);
  let d=`M ${x(0)} ${y(data[0])}`;
  for(let i=1;i<data.length;i++){
    const cx=(x(i-1)+x(i))/2;
    d+=` C ${cx} ${y(data[i-1])}, ${cx} ${y(data[i])}, ${x(i)} ${y(data[i])}`;
  }
  return {line:d, fill:`${d} L ${x(data.length-1)} ${h} L ${x(0)} ${h} Z`};
}
function sparkline(data,stroke){
  const p=areaPath(data,96,44,4);
  return `<svg class="spark" viewBox="0 0 96 44" fill="none" aria-hidden="true">
    <path d="${p.line}" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/></svg>`;
}

function render(){
  const html=document.documentElement;
  html.lang=S.lang; html.dir=T[S.lang].dir;
  _phoneSeq = 0;
  const r=S.route, root=document.getElementById('root');
  let view;
  // The in-page "app" was a prototype: screens that looked like the product
  // but were not it, so a visitor who clicked through never actually signed
  // up for anything. Those routes now hand over to the real product. /app is
  // server-guarded, so a visitor without a session lands on /signin and a
  // merchant with one lands on their own dashboard — decided by the server
  // rather than guessed here.
  if(r.startsWith('/app')){ location.replace('/app'); return; }
  else if(r==='/login'){ location.replace('/signin'); return; }
  else if(r==='/card'){ view=walletView(); }
  else { view=homeView(); }
  root.innerHTML=view + (S.menuOpen?mobMenu():'') + (S.sheet==='contact'?contactSheet():'');
  window.scrollTo(0,0);
  afterRender();
}

}

const REDUCED = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
const CAN_ANIMATE = () => 'IntersectionObserver' in window && !REDUCED();

function afterRender(){
  /* --- already signed in? ---------------------------------------------
     Inviting a merchant who is signed in to "start a free trial" is the
     kind of small wrongness that makes a site feel unattended. Done here
     rather than inside each view so there is one rule, applied to every
     sign-up and sign-in link the page renders, wherever it appears. */
  if(SIGNED_IN){
    document.querySelectorAll('a[href="/signup"],a[href="/signin"]').forEach(a=>{
      a.setAttribute('href','/app');
      /* Only relabel real buttons. Some of these links are icons or cards
         whose text is not a call to action. */
      if(a.classList.contains('btn')||a.classList.contains('store')) a.textContent=t('dashboard_cta');
    });
  }

  const b=document.querySelector('.topbar .burger');
  if(b && window.innerWidth<900) b.style.display='grid';

  /* --- header: transparent until 40px --------------------------- */
  const tb=document.getElementById('topbar');
  if(tb){const on=()=>tb.classList.toggle('stuck',scrollY>40);on();
    addEventListener('scroll',on,{passive:true});}

  wireToggleIndicator();
  wireAccordion();

  if(!CAN_ANIMATE()){                       /* content stays as shipped */
    document.documentElement.classList.remove('anim');
    document.querySelectorAll('[data-count]').forEach(el=>{});
    return;
  }
  document.documentElement.classList.add('anim');

  /* --- stagger: 0.08s apart, first 8 only ------------------------ */
  document.querySelectorAll('[data-stagger]').forEach(group=>{
    [...group.children].forEach((child,i)=>{
      if(!child.classList.contains('rise')) child.classList.add('rise');
      child.style.transitionDelay = (i<8 ? i*0.08 : 0.64) + 's';
    });
  });

  /* --- reveal once, 20% in, then release will-change -------------- */
  const io=new IntersectionObserver((es,obs)=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    e.target.classList.add('in');
    obs.unobserve(e.target);
    e.target.addEventListener('transitionend',()=>e.target.classList.add('done'),{once:true});
  }),{rootMargin:'-100px 0px',threshold:0.2});
  document.querySelectorAll('.rise').forEach(el=>io.observe(el));

  /* --- hero plays on load, no scroll needed ---------------------- */
  const hero=document.querySelector('.hero');
  if(hero){
    const seq=[['.hero-kicker,.hero h1',0],['.hero .lede',.1],['.hero-cta,.wallets',.2],
               ['.cardtabs,.card-stage,.card-cap',.3]];
    seq.forEach(([sel,d])=>hero.querySelectorAll(sel).forEach(el=>{
      el.classList.add('rise','hero-el'); el.style.transitionDelay=d+'s';
      io.unobserve(el);
    }));
    const stage=hero.querySelector('.card-stage');
    if(stage) stage.classList.add('rise-scale');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      hero.querySelectorAll('.hero-el').forEach(el=>{
        el.classList.add('in');
        el.addEventListener('transitionend',()=>el.classList.add('done'),{once:true});
      });
    }));
  }

  tilt3d();
  countUp();
  const card=document.getElementById('loyalty');
  if(card) stampOnce(card);

  const scan=document.getElementById('scanMock');
  if(scan){
    const so=new IntersectionObserver(es=>es.forEach(e=>{
      if(!e.isIntersecting) return;
      so.disconnect();
      scan.classList.add('play');
      /* drop the class when the three sweeps finish so nothing keeps ticking */
      scan.querySelector('.scan-line')
          ?.addEventListener('animationend',()=>scan.classList.remove('play'),{once:true});
    }),{threshold:.4});
    so.observe(scan);
  }
}

/* ------------------------------------------------------------------
   3D tilt on every phone mock.
   Pointer-driven, so nothing moves on its own — this stays inside the
   "one continuous animation" rule while still giving real depth.
   Fine pointers only: on touch a tilt you cannot aim is just jitter.
------------------------------------------------------------------ */
function tilt3d(){
  if (REDUCED()) return;
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  const MAX = 13;                       // degrees at the far corner
  document.querySelectorAll('.ip-shell').forEach(shell => {
    const ph = shell.querySelector('.iphone');
    if (!ph || shell.dataset.tilt) return;
    shell.dataset.tilt = '1';

    let frame = null;

    const apply = (e) => {
      const r  = shell.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width  - 0.5;   // -0.5 … 0.5
      const py = (e.clientY - r.top)  / r.height - 0.5;
      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        ph.style.transform =
          `rotateY(${(px * MAX * 2).toFixed(2)}deg) rotateX(${(-py * MAX * 2).toFixed(2)}deg)`;
        shell.style.setProperty('--ga', `${(100 + px * 50).toFixed(0)}deg`);
      });
    };

    shell.addEventListener('pointerenter', () => ph.classList.add('tilting'));
    shell.addEventListener('pointermove', apply);
    shell.addEventListener('pointerleave', () => {
      if (frame) cancelAnimationFrame(frame);
      /* ease back to rest with the drift still suspended, then resume it,
         so the phone never snaps to a random point in the cycle */
      ph.classList.remove('tilting');
      ph.classList.add('settling');
      ph.style.transform = '';
      setTimeout(() => { ph.classList.remove('settling'); }, 440);
    });
  });
}

/* --- the pricing indicator slides to the active button ----------- */
function wireToggleIndicator(){
  const wrap=document.getElementById('prToggle');
  if(!wrap) return;
  const place=()=>{
    const on=wrap.querySelector('button.on'), ind=wrap.querySelector('.ind');
    if(!on||!ind) return;
    const rtl=getComputedStyle(document.documentElement).direction==='rtl';
    /* fixed base width + scaleX, so only transform animates */
    const base=wrap.querySelector('button');
    if(!ind.dataset.base){ ind.dataset.base=base.offsetWidth; ind.style.width=base.offsetWidth+'px'; }
    const w=parseFloat(ind.dataset.base)||base.offsetWidth;
    const off = rtl ? wrap.getBoundingClientRect().right - on.getBoundingClientRect().right
                    : on.offsetLeft - wrap.clientLeft;
    ind.style.transform=`translateX(${rtl?-off:off}px) scaleX(${on.offsetWidth/w})`;
  };
  place(); addEventListener('resize',place,{passive:true});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(place);
}

/* --- accordion: one open at a time, height via grid rows --------- */
function wireAccordion(){
  document.querySelectorAll('[data-qa]').forEach(sum=>{
    const toggle=()=>{
      const qa=sum.closest('.qa'), open=qa.classList.contains('open');
      qa.closest('.faq')?.querySelectorAll('.qa.open').forEach(o=>{
        o.classList.remove('open'); o.querySelector('[data-qa]')?.setAttribute('aria-expanded','false');
      });
      if(!open){ qa.classList.add('open'); sum.setAttribute('aria-expanded','true'); }
    };
    sum.addEventListener('click',toggle);
    sum.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
    });
  });
}

/* --- numeric count-up, and the 0.3s price change ----------------- */
function tween(el,from,to,dur,fmt){
  if(REDUCED()){el.textContent=fmt(to);return;}
  const t0=performance.now();
  el.style.willChange='contents';
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e);
    if(p<1) requestAnimationFrame(step); else {el.textContent=fmt(to);el.style.willChange='auto';}
  })(t0);
}
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(dn(el.dataset.count))||0, prefix=el.dataset.prefix||'';
    const raw=el.textContent.trim();
    const suffix=(el.dataset.suffix||'') || (/%$/.test(raw)?'%':'');
    if(!target) return;
    const co=new IntersectionObserver(es=>es.forEach(e=>{
      if(!e.isIntersecting) return; co.unobserve(el);
      tween(el,0,target,500,v=>prefix+n(Math.round(v).toLocaleString('en'))+suffix);
      setTimeout(()=>el.textContent=raw,520);
    }),{threshold:.4});
    co.observe(el);
  });
}
function animatePrices(prev){
  document.querySelectorAll('[data-price]').forEach(el=>{
    const to=parseFloat(el.dataset.price);
    const from=prev==='annual'? to/10 : to*10;
    tween(el,from,to,300,v=>cur(Math.round(v)));
  });
}
let stampTimer;
/* The card fills itself once, when it first scrolls into view, then rests.
   The 4s float is the page's only continuous motion. */
function stampOnce(card){
  clearInterval(stampTimer);
  if(REDUCED() || !('IntersectionObserver' in window)) return;

  const run=()=>{
    let filled=S.lcStamps;
    stampTimer=setInterval(()=>{
      if(!document.body.contains(card)){clearInterval(stampTimer);return;}
      if(filled>=LC_TOTAL){clearInterval(stampTimer);return;}
      const el=card.querySelectorAll('.slot')[filled];
      filled++;
      if(el){ el.classList.add('filled','pop');
        setTimeout(()=>el.classList.remove('pop'),400); }
      const rail=card.querySelector('.slots');
      if(rail) rail.style.setProperty('--fill', filled<=1?0:(filled-1)/(LC_TOTAL-1));
      const c=card.querySelector('#stampCount');
      if(c){
        const key=(CARD_META[S.cardType]||CARD_META.coffee).unit;
        c.textContent=`${n(filled)} ${t(key)}`;
      }
      const tile=card.querySelector('.lc-tiles b');
      if(tile) tile.textContent=`${n(filled)} ${t('lc_of')} ${n(LC_TOTAL)}`;
    },520);
  };

  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){io.disconnect();setTimeout(run,700);}
  }),{threshold:.4});
  io.observe(card);
}

function toast(msg,icon='check'){
  const wrap=document.getElementById('toast');
  const el=document.createElement('div');
  el.innerHTML=`<span class="tick" style="width:20px;height:20px">${ic(icon,11,3)}</span>${msg}`;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';
    el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),320);},2600);
}

function aiReply(container,question,answerHTML){
  container.insertAdjacentHTML('beforeend',`<div class="msg msg-u">${question}</div>`);
  const think=document.createElement('div');
  think.className='msg msg-a';
  think.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  container.appendChild(think);
  container.scrollTop=container.scrollHeight;
  setTimeout(()=>{think.innerHTML=answerHTML;container.scrollTop=container.scrollHeight;},900);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-ask],[data-toggle],[data-brand]');
  if(!el) return;
  const act=el.dataset.act;

  if(el.dataset.ask){
    const body=document.getElementById('aiBody');
    aiReply(body,t(el.dataset.ask),AI_ANSWERS[el.dataset.ask][S.lang]);
    return;
  }
  if(el.dataset.toggle){
    const k=el.dataset.toggle; S.toggles[k]=!S.toggles[k];
    el.classList.toggle('on',S.toggles[k]); el.setAttribute('aria-checked',S.toggles[k]);
    toast(S.toggles[k]?(isAr()?'تم التفعيل':'Turned on'):(isAr()?'تم الإيقاف':'Turned off'));
    return;
  }
  if(act==='stampcount'){ S.hwStamps=(S.hwStamps+1)%6; render();
    document.getElementById('how')?.scrollIntoView({block:'center'}); return; }
  if(el.dataset.card){
    if(S.cardType===el.dataset.card) return;
    S.cardType=el.dataset.card; render();
    const c=document.getElementById('loyalty');
    if(c && !REDUCED()){ c.classList.add('lc-swap');
      c.addEventListener('animationend',()=>c.classList.remove('lc-swap'),{once:true}); }
    return; }
  if(el.dataset.bill){
    const prev=S.billing;
    if(prev===el.dataset.bill) return;
    S.billing=el.dataset.bill; render();
    animatePrices(prev);
    return; }
  if(el.dataset.brand){
    S.brand=el.dataset.brand; lnxSetCookie('lnx-brand2',S.brand);
    document.querySelectorAll('[data-brand]').forEach(b=>b.classList.toggle('on',b.dataset.brand===S.brand));
    const c=document.getElementById('loyalty');
    if(c) c.style.background=S.brand;
    return;
  }

  switch(act){
    case 'lang':
      S.lang = S.lang==='en'?'ar':'en'; lnxSetCookie('lnx-lang',S.lang); render(); break;
    case 'menu':
      if(S.menuOpen){ closeMenu(); }
      else { S.menuOpen=true; render();
        requestAnimationFrame(()=>{
          document.querySelector('.mobmenu')?.classList.add('in');
          document.querySelector('.mob-scrim')?.classList.add('in');
        });
      }
      break;
    case 'side':
      S.sideOpen=true; document.getElementById('side').classList.add('open');
      document.querySelector('.main').insertAdjacentHTML('beforebegin','<div class="scrim" data-act="closeside"></div>');
      break;
    case 'closeside':
      S.sideOpen=false; document.getElementById('side').classList.remove('open');
      document.querySelector('.scrim')?.remove(); break;
    case 'ai':{
      const inp=document.getElementById('aiAsk');
      const q=(inp.value||'').trim();
      let out=document.getElementById('aiOut');
      if(!q){inp.focus();return;}
      out.innerHTML=`<div class="ai-body" style="min-height:0;border-top:1px solid var(--line)"></div>`;
      aiReply(out.firstElementChild,q,AI_FALLBACK[S.lang]);
      inp.value=''; break;
    }
    case 'genCamp':{
      const out=document.getElementById('campOut');
      if(out){
        out.innerHTML=`<div class="ai-body" style="min-height:0;border-top:1px solid var(--line)"></div>`;
        aiReply(out.firstElementChild,isAr()?'ولّد حملة لهذا الأسبوع':'Generate a campaign for this week',AI_ANSWERS.ai_q3[S.lang]);
      } else toast(isAr()?'جارٍ توليد الحملة':'Generating campaign');
      break;
    }
    case 'contact':     S.sheet='contact'; render();
      setTimeout(()=>document.getElementById('cf-n')?.focus(),60); break;
    case 'closeSheet':  S.sheet=null; render(); break;
    case 'sendContact':{
      const email=document.getElementById('cf-e');
      if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value)){
        email.focus(); email.style.borderColor='var(--red)';
        toast(isAr()?'أدخل بريد عمل صحيح':'Enter a valid work email','x');
        return;
      }
      S.sheet=null; render(); toast(t('c_sent')); break;
    }
    case 'export': toast(isAr()?'جارٍ تجهيز ملف CSV':'Preparing your CSV'); break;
    case 'save':   toast(t('saved')); break;
    case 'copy':   toast(t('copied'),'copy'); break;
    case 'toast':  toast(t('demo_toast'),'spark'); break;
  }
});
